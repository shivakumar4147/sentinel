version: "3.8"

services:
  # =================================================================
  # MEMBER 1: Central Control Plane Backend
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_password}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3:latest
      - OLLAMA_MOCK_MODE=True
      - SAFETY_DRY_RUN=True
      - REQUIRE_HUMAN_APPROVAL_FOR_MEDIUM=True
      - REQUIRE_HUMAN_APPROVAL_FOR_HIGH=True
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only Docker access for connector
    networks:
      - sentinel-net

  # =================================================================
  # CORE INFRASTRUCTURE: Database
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-net

  # =================================================================
  # MEMBER 2: Frontend Dashboard (React + Vite)
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sentinel-net

  # =================================================================
  # MEMBER 3: AI Engine (Ollama Local Instance)
  # =================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - sentinel-net

  # =================================================================
  # MEMBER 4: Monitoring (Prometheus)
  # =================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - sentinel-net

  # =================================================================
  # MEMBER 4: Demo Application Service (Test Target)
  # =================================================================
  demo-api:
    build:
      context: ./demo-application/api
      dockerfile: Dockerfile
    container_name: sentinel-demo-api
    restart: unless-stopped
    ports:
      - "${DEMO_API_PORT:-5000}:5000"
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  pgdata:
  ollama-models:


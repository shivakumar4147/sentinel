global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "veloura-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["sentinel-ecommerce-api:5000"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["sentinel-ecommerce-cadvisor:8080"]
